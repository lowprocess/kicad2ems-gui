[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad2ems-gui"
dynamic = ["version"]
description = "kicad2ems's window: settings, runs and results (S-parameters, fields, antennas) of KiCad boards' EM simulations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
authors = [{ name = "Claude", email = "noreply@anthropic.com" }]
dependencies = [
    "kicad2ems>=261028.post1",     # the board model, settings, solvers, runs, examples (kicad2ems.api.frontend 2.1)
    "PySide6-Essentials>=6.5",
    "pyqtgraph>=0.13",
    "h5py>=3",                     # frequency-domain field dumps, far fields
    "PyOpenGL>=3.1",               # the 3D field view
    "numpy>=1.24",                 # imported here too (each also comes with kicad2ems)
    "shapely>=2.0",                # volume3d: the board's outline and copper
    "matplotlib>=3.7",             # volume3d: colour maps
    "pillow>=9",                   # fieldtab: saving a frame
]

[project.optional-dependencies]
filter = ["dfsynth @ git+https://github.com/lowprocess/dfsynth"]   # the Filter page: dfsynth's filter synthesis
test = ["pytest>=7"]

[project.scripts]
kicad2ems-gui = "kicad2ems_gui:main"
kicad2openems-gui = "kicad2ems_gui:main"     # the old name

[tool.setuptools.dynamic]
version = {attr = "kicad2ems_gui.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kicad2ems_gui = ["*.svg"]                  # the window's and the application launcher's icon, the wand

[tool.pytest.ini_options]
testpaths = ["tests"]
